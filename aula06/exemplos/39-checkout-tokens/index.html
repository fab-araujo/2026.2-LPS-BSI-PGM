<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AgroFeira — fechamento do pedido, com os tokens</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous">
    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="agrofeira-bootstrap.css">
  </head>
  <body>
    <main class="container py-4">
      <h1 class="h3 mb-5">Fechar o pedido</h1>
      <form class="row g-3">
        <div class="col-12 col-md-6">
          <label for="nome" class="form-label">Nome completo</label>
          <input type="text" class="form-control" id="nome" name="nome" autocomplete="name" required>
        </div>
        <div class="col-12 col-md-6">
          <label for="email" class="form-label">E-mail</label>
          <input type="email" class="form-control" id="email" name="email" autocomplete="email" required>
        </div>
        <div class="col-12 col-md-6">
          <label for="telefone" class="form-label">Telefone</label>
          <input type="tel" class="form-control" id="telefone" name="telefone" autocomplete="tel" required>
        </div>
        <fieldset class="col-12">
          <legend class="h6">Forma de recebimento</legend>
          <div class="form-check form-check-inline">
            <input type="radio" class="form-check-input" id="retirada" name="recebimento" value="retirada" checked>
            <label class="form-check-label" for="retirada">Retirada na feira</label>
          </div>
          <div class="form-check form-check-inline">
            <input type="radio" class="form-check-input" id="entrega" name="recebimento" value="entrega">
            <label class="form-check-label" for="entrega">Entrega no endereço</label>
          </div>
        </fieldset>
        <div class="col-12 col-md-8">
          <label for="rua" class="form-label">Rua e número</label>
          <input type="text" class="form-control" id="rua" name="rua" autocomplete="address-line1">
        </div>
        <div class="col-12 col-md-4">
          <label for="bairro" class="form-label">Bairro</label>
          <input type="text" class="form-control" id="bairro" name="bairro">
        </div>
        <div class="col-12 col-md-4">
          <label for="cep" class="form-label">CEP</label>
          <input type="text" class="form-control" id="cep" name="cep" inputmode="numeric"
            pattern="[0-9]{5}-?[0-9]{3}" autocomplete="postal-code">
        </div>
        <div class="col-12 col-md-8">
          <label for="horario" class="form-label">Horário</label>
          <select class="form-select" id="horario" name="horario" required>
            <option value="">Escolha um horário</option>
            <option>Sexta-feira, das 8h às 10h</option>
            <option>Sexta-feira, das 10h às 12h</option>
            <option>Sexta-feira, das 14h às 16h</option>
          </select>
        </div>
        <div class="col-12">
          <label for="obs" class="form-label">Observações</label>
          <textarea class="form-control" id="obs" name="obs" rows="3"></textarea>
        </div>
        <div class="col-12">
          <div class="form-check">
            <input type="checkbox" class="form-check-input" id="termos" name="termos" required>
            <label class="form-check-label" for="termos">Li e aceito as regras da feira</label>
          </div>
        </div>
        <div class="col-12">
          <button type="submit" class="btn btn-primary">Fazer pedido</button>
        </div>
      </form>
    </main>
  </body>
</html>
