<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AgroFeira — filtros só com o Reboot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous">
  </head>
  <body>
    <main class="container py-4">
      <h1 class="h3 mb-5">Filtros do catálogo</h1>
      <search>
        <form>
          <p>
            <label for="busca">Buscar produto</label>
            <input type="search" id="busca" name="q">
          </p>
          <p>
            <label for="produtor">Produtor</label>
            <select id="produtor" name="produtor">
              <option value="">Todos</option>
              <option>Sítio Boa Vista</option>
              <option>Casa de Farinha São José</option>
              <option>Horta da Dona Rosa</option>
            </select>
          </p>
          <p>
            <input type="checkbox" id="disponivel" name="disponivel">
            <label for="disponivel">Só disponíveis agora</label>
          </p>
          <button type="submit">Filtrar</button>
        </form>
      </search>
    </main>
  </body>
</html>
