<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AgroFeira — o anel de foco do projeto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous">
    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="agrofeira-bootstrap.css">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"></script>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary" aria-label="Principal">
      <div class="container">
        <a class="navbar-brand" id="marca" href="#">AgroFeira</a>
        <div class="collapse navbar-collapse show">
          <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link active" id="link-barra" aria-current="page" href="#">Início</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Produtos</a></li>
          </ul>
        </div>
      </div>
    </nav>
    <main class="container py-4">
      <h1 class="h3 mb-3">O anel de foco de cada peça</h1>
      <ul class="nav nav-underline mb-3">
        <li class="nav-item"><a class="nav-link active" id="link-nav" aria-current="page" href="#">Todos</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Em estoque</a></li>
      </ul>
      <div class="card">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="card-title h5 mb-0">Açaí médio</h2>
            <button type="button" class="btn-close" id="fechar" aria-label="Fechar"></button>
          </div>
          <p class="mb-3">
            <button type="button" class="btn btn-primary" id="adicionar">Adicionar</button>
          </p>
          <p class="mb-3">
            <button type="button" class="btn btn-outline-secondary" id="detalhes">Ver detalhes</button>
          </p>
          <div class="mb-3 w-25">
            <label for="busca" class="form-label">Buscar produto</label>
            <input type="search" class="form-control" id="busca" name="busca">
          </div>
          <div class="form-check mb-3">
            <input type="checkbox" class="form-check-input" id="disp" name="disp">
            <label class="form-check-label" for="disp">Só disponíveis agora</label>
          </div>
          <p class="mb-0"><a href="#" id="link">página do produtor</a></p>
        </div>
      </div>
    </main>
  </body>
</html>
