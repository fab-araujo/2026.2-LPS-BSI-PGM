<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AgroFeira — contraste das variantes, corrigido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous">
    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="agrofeira-bootstrap.css">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"></script>
  </head>
  <body>
    <main class="container py-4">
      <h1 class="h3 mb-4">Contraste das variantes</h1>
      <div class="row g-4">
        <div class="col-6 col-md-4">
          <p class="mb-2">btn-warning</p>
          <button type="button" class="btn btn-warning" id="a-warning">Avisar produtor</button>
        </div>
        <div class="col-6 col-md-4">
          <p class="mb-2">text-bg-success</p>
          <span class="badge text-bg-success" id="a-success">Safra nova</span>
        </div>
        <div class="col-6 col-md-4">
          <p class="mb-2">text-body-secondary</p>
          <p class="text-body-secondary mb-0" id="a-secundario">Sítio Boa Vista</p>
        </div>
        <div class="col-6 col-md-4">
          <p class="mb-2">btn-primary do projeto</p>
          <button type="button" class="btn btn-primary" id="a-primary">Adicionar</button>
        </div>
        <div class="col-6 col-md-4">
          <p class="mb-2">btn-outline-secondary</p>
          <button type="button" class="btn btn-outline-secondary" id="a-outline">Ver detalhes</button>
        </div>
      </div>
    </main>
  </body>
</html>
