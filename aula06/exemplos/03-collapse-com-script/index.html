<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AgroFeira — o botão com o script</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </head>
  <body>
    <main class="container py-4">
      <h1>AgroFeira</h1>
      <p>Da roça para a mesa, em Paragominas.</p>
      <p>
        <button type="button" class="btn btn-primary"
          data-bs-toggle="collapse" data-bs-target="#entrega">
          Como funciona a entrega
        </button>
      </p>
      <div class="collapse" id="entrega">
        <div class="alert alert-warning">
          Entregas só às sextas-feiras. Pedidos até quinta, às 18h.
        </div>
      </div>
    </main>
  </body>
</html>
