<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AgroFeira — o cartão em Bootstrap, marca trocada</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous">
    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="agrofeira-bootstrap.css">
  </head>
  <body>
    <main class="container py-3">
      <h1 class="h3 mb-3">Produtos da semana</h1>
      <article class="card p-3">
        <div class="d-flex align-items-center gap-3">
          <img src="acai-336.jpg" alt="Tigela de açaí"
            class="rounded" width="112" height="112">
          <div>
            <h2 class="h5 mb-1">Açaí médio</h2>
            <p class="text-body-secondary mb-1">
              Sítio Boa Vista, Colônia do Uraim</p>
            <p class="fw-bold mb-2">R$ 12,00 o litro</p>
            <button type="button" class="btn btn-primary">
              Adicionar</button>
          </div>
        </div>
      </article>
    </main>
  </body>
</html>
