<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AgroFeira — preço máximo sem grupo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous">
  </head>
  <body>
    <main class="container py-4">
      <h1 class="h3 mb-5">Filtros do catálogo</h1>
      <form>
        <div class="mb-3">
          <label for="preco" class="form-label">Preço máximo</label>
          <input type="number" class="form-control" id="preco" name="preco" min="0" step="0.01">
        </div>
        <button type="submit">Filtrar</button>
      </form>
    </main>
  </body>
</html>
