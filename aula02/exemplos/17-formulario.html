<form>
  <label for="nome">Nome do produtor</label>
  <input type="text" id="nome" name="nome">

  <label for="cidade">Cidade</label>
  <select id="cidade" name="cidade">
    <option>Paragominas</option>
    <option>Ulianópolis</option>
  </select>

  <label for="obs">Observações</label>
  <textarea id="obs" name="obs" rows="2"></textarea>

  <fieldset>
    <legend>Como prefere receber o pedido?</legend>
    <input type="radio" id="feira" name="entrega" value="feira">
    <label for="feira">Retirar na feira</label>
    <input type="radio" id="casa" name="entrega" value="casa">
    <label for="casa">Receber em casa</label>
  </fieldset>

  <input type="checkbox" id="aceite" name="aceite" value="1">
  <label for="aceite">Aceito as regras da feira</label>

  <button type="submit">Enviar cadastro</button>
</form>
