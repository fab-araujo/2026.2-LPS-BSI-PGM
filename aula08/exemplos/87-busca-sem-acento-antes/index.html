<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Busca sem tirar acentos</title>
    <link rel="stylesheet" href="camadas.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="componentes.css">
    <link rel="stylesheet" href="utilitarios.css">
    <link rel="stylesheet" href="estados.css">
    <script type="module" src="js/app.js"></script>
  </head>
  <body class="pagina-catalogo">
    <header class="cabecalho-site">
      <h1>AgroFeira</h1>
    </header>
    <main id="conteudo">
      <h2>Produtos da semana</h2>
      <search class="busca">
        <label for="busca">Buscar produto</label>
        <input type="search" id="busca">
      </search>
      <p id="contador" role="status" aria-live="polite"></p>
      <ul class="lista-produtos" id="lista"></ul>
    </main>
    <template id="modelo-cartao">
      <li class="cartao-produto">
        <article>
          <img src="acai.jpg" width="640" height="480" alt="">
          <h3>Nome do produto</h3>
          <p class="produtor">Produtor</p>
          <p class="preco">Preço</p>
          <button type="button">Adicionar</button>
        </article>
      </li>
    </template>
  </body>
</html>
