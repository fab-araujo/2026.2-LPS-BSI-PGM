<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Diálogo sem script</title>
  </head>
  <body>
    <h1>AgroFeira</h1>
    <button type="button" command="show-modal" commandfor="aviso">Ver aviso</button>
    <dialog id="aviso">
      <p>A feira de sábado começa às 6 horas.</p>
      <button type="button" command="close" commandfor="aviso">Fechar</button>
    </dialog>
  </body>
</html>
