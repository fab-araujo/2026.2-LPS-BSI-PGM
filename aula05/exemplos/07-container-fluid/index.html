<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AgroFeira — .container-fluid</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous">
    <script defer
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"></script>
  </head>
  <body>
    <div class="container-fluid">
      <header>
        <h1>AgroFeira</h1>
      </header>
      <main>
        <h2>Produtos da semana</h2>
        <article>
          <img src="acai.jpg" class="img-fluid" width="640" height="480"
            alt="Tigela de açaí batido, com duas colheres de plástico">
          <h3>Açaí médio</h3>
          <p>Sítio Boa Vista, Colônia do Uraim</p>
          <p>R$ 12,00 o litro</p>
          <button type="button">Adicionar</button>
        </article>
      </main>
    </div>
  </body>
</html>
