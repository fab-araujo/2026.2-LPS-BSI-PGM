<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AgroFeira — só o link do Bootstrap</title>
    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  </head>
  <body>
    <header>
      <h1>AgroFeira</h1>
    </header>
    <main>
      <h2>Produtos da semana</h2>
      <article>
        <img src="acai.jpg" width="640" height="480"
          alt="Tigela de açaí batido, com duas colheres de plástico">
        <h3>Açaí médio</h3>
        <p>Sítio Boa Vista, Colônia do Uraim</p>
        <p>R$ 12,00 o litro</p>
        <button type="button">Adicionar</button>
      </article>
      <article>
        <img src="farinha.jpg" width="640" height="480"
          alt="Pote de farinha de mandioca sobre a mesa">
        <h3>Farinha d'água</h3>
        <p>Casa de Farinha São José, Comunidade Nova Vida</p>
        <p>R$ 90,00 a lata</p>
        <button type="button">Adicionar</button>
      </article>
      <article>
        <img src="banana.jpg" width="640" height="480"
          alt="Cachos de banana empilhados numa banca de feira">
        <h3>Banana-prata</h3>
        <p>Sítio Três Irmãos, Colônia do Uraim</p>
        <p>R$ 8,00 a dúzia</p>
        <button type="button">Adicionar</button>
      </article>
    </main>
  </body>
</html>
