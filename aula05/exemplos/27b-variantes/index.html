<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AgroFeira — as variantes de cor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous">
  </head>
  <body>
    <div class="container py-4">
      <div>
        <p class="badge text-bg-primary">primary</p>
        <p class="badge text-bg-secondary">secondary</p>
        <p class="badge text-bg-success">success</p>
        <p class="badge text-bg-danger">danger</p>
        <p class="badge text-bg-warning">warning</p>
        <p class="badge text-bg-info">info</p>
        <p class="badge text-bg-light">light</p>
        <p class="badge text-bg-dark">dark</p>
      </div>
      <p>
        <button type="button" class="btn btn-primary">primary</button>
        <button type="button" class="btn btn-secondary">secondary</button>
        <button type="button" class="btn btn-success">success</button>
        <button type="button" class="btn btn-danger">danger</button>
        <button type="button" class="btn btn-warning">warning</button>
        <button type="button" class="btn btn-info">info</button>
        <button type="button" class="btn btn-light">light</button>
        <button type="button" class="btn btn-dark">dark</button>
      </p>
    </div>
  </body>
</html>
