<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AgroFeira — os filtros</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous">
  </head>
  <body>
    <div class="container">
      <header class="py-3 mb-4">
        <h1 class="h3 mb-0">AgroFeira</h1>
      </header>
      <main>
        <h2 class="mb-3">Produtos da semana</h2>
        <search>
        <form class="row g-2 mb-4">
          <div class="col-12 col-md-7">
            <label class="form-label" for="busca">Buscar produto</label>
            <input class="form-control" type="search" id="busca" name="busca">
          </div>
          <div class="col-12 col-md-5">
            <label class="form-label" for="categoria">Categoria</label>
            <select class="form-select" id="categoria" name="categoria">
                <option>Todas</option>
                <option>Frutos da floresta</option>
                <option>Derivados da mandioca</option>
                <option>Especiarias</option>
                <option>Cacau e chocolate</option>
                <option>Hortaliças e temperos</option>
            </select>
          </div>
        </form>
        </search>
        <ul class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-3 list-unstyled">
          <li class="col">
            <article class="card h-100">
              <img src="acai.jpg" class="card-img-top img-fluid" width="640" height="480"
                alt="Tigela de açaí batido, com duas colheres de plástico">
              <div class="card-body">
                <h3 class="card-title h5">Açaí médio</h3>
                <p class="card-text text-body-secondary">Sítio Boa Vista, Colônia do Uraim</p>
                <p class="card-text fw-bold">R$ 12,00 o litro</p>
                <button type="button" class="btn btn-primary">Adicionar</button>
              </div>
            </article>
          </li>
          <li class="col">
            <article class="card h-100">
              <img src="farinha.jpg" class="card-img-top img-fluid" width="640" height="480"
                alt="Pote de farinha de mandioca sobre a mesa">
              <div class="card-body">
                <h3 class="card-title h5">Farinha d'água</h3>
                <p class="card-text text-body-secondary">Casa de Farinha São José, Comunidade Nova Vida</p>
                <p class="card-text fw-bold">R$ 90,00 a lata</p>
                <button type="button" class="btn btn-primary">Adicionar</button>
              </div>
            </article>
          </li>
          <li class="col">
            <article class="card h-100">
              <img src="banana.jpg" class="card-img-top img-fluid" width="640" height="480"
                alt="Cachos de banana empilhados numa banca de feira">
              <div class="card-body">
                <h3 class="card-title h5">Banana-prata</h3>
                <p class="card-text text-body-secondary">Sítio Três Irmãos, Colônia do Uraim</p>
                <p class="card-text fw-bold">R$ 8,00 a dúzia</p>
                <button type="button" class="btn btn-primary">Adicionar</button>
              </div>
            </article>
          </li>
        </ul>
      </main>
    </div>
  </body>
</html>
