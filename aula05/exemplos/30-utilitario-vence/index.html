<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AgroFeira — o utilitário vence</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous">
    <script defer
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"></script>
    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="agrofeira-bootstrap.css">
  </head>
  <body>
    <div class="container py-4">
      <div class="row">
        <div class="col-12 col-sm-8 col-md-5 col-lg-4">
          <article class="card">
            <img src="acai.jpg" class="card-img-top" width="640" height="480"
              alt="Tigela de açaí batido, com duas colheres de plástico">
            <div class="card-body p-2">
              <h3 class="card-title h5">Açaí médio</h3>
              <p class="card-text text-body-secondary">Sítio Boa Vista, Colônia do Uraim</p>
              <p class="card-text fw-bold">R$ 12,00 o litro</p>
              <button type="button" class="btn btn-primary">Adicionar</button>
            </div>
          </article>
        </div>
      </div>
    </div>
  </body>
</html>
