<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AgroFeira — produtos da semana</title>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="estilo.css">
  </head>
  <body>
    <header class="cabecalho-site">
      <p>AgroFeira</p>
    </header>
    <main>
      <h1>Produtos da semana</h1>
      <p>Colhido nos sítios da região e vendido direto, sem atravessador.</p>
      <h2>Em destaque</h2>
      <ul class="lista-produtos">
        <li class="cartao-produto">
          <img src="acai.jpg" width="640" height="480"
            alt="Tigela de açaí batido, com duas colheres de plástico">
          <h3>Açaí médio</h3>
          <p class="produtor">Sítio Boa Vista, Colônia do Uraim</p>
          <p class="preco">R$ 12,00 o litro</p>
          <button type="button">Adicionar</button>
        </li>
      </ul>
    </main>
    <footer class="rodape-site">
      <p>AgroFeira · Paragominas, PA</p>
    </footer>
  </body>
</html>
