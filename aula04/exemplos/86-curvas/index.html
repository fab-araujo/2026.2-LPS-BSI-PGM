<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AgroFeira — curvas de transição</title>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="estilo.css">
  </head>
  <body>
    <main>
      <h1>Cinco curvas, o mesmo trajeto</h1>
      <p>Passe o ponteiro sobre a lista: as cinco barras andam a mesma
        distância, no mesmo tempo (um segundo).</p>
      <ul class="pista">
        <li><p class="barra linear">linear</p></li>
        <li><p class="barra ease">ease</p></li>
        <li><p class="barra ease-in">ease-in</p></li>
        <li><p class="barra ease-out">ease-out</p></li>
        <li><p class="barra ease-in-out">ease-in-out</p></li>
      </ul>
    </main>
  </body>
</html>
